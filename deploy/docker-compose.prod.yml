services:
  web:
    image: ghcr.io/la-termitiere/termitiere-platform:${IMAGE_TAG}
    container_name: termitiere-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN_APP: "${DOMAIN_APP}"
      DOMAIN_API: "${DOMAIN_API}"
      DOMAIN_SITE: "${DOMAIN_SITE}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
