name: Build & Push to GHCR

on:
  push:
    branches:
      - vps-deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f deploy/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/termitiere-platform:latest \
            --build-arg VITE_USE_SUPABASE=true \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/termitiere-platform:latest
