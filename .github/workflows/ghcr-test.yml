name: Build & Push to GHCR

on:
  push:
    branches:
      - vps-deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}

          IMAGE_LATEST="ghcr.io/${OWNER_LOWER}/termitiere-platform:latest"
          IMAGE_SHA="ghcr.io/${OWNER_LOWER}/termitiere-platform:${SHA}"

          echo "Building:"
          echo "$IMAGE_LATEST"
          echo "$IMAGE_SHA"

          docker build \
            -f deploy/Dockerfile \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            --build-arg VITE_USE_SUPABASE=true \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            .

      - name: Push images
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}

          docker push ghcr.io/${OWNER_LOWER}/termitiere-platform:latest
          docker push ghcr.io/${OWNER_LOWER}/termitiere-platform:${SHA}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |

            set -e

            cd ~/termitiere-platform

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            SHA=${{ github.sha }}
            SHA_SHORT=${SHA::7}

            echo "======================================="
            echo "Deploy commit : $SHA_SHORT"
            echo "======================================="

            echo "Login GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

            echo "Saving current running image..."
            OLD_IMAGE=$(docker inspect termitiere-web --format '{{.Config.Image}}' || true)

            echo "Old image: $OLD_IMAGE"

            echo "Pull new image..."
            docker pull ghcr.io/$OWNER/termitiere-platform:$SHA_SHORT || {
              echo "❌ Pull failed"
              exit 1
            }

            echo "Updating docker-compose to new tag..."
            sed -i "s|termitiere-platform:latest|termitiere-platform:$SHA_SHORT|g" deploy/docker-compose.prod.yml

            echo "Restart containers..."
            docker compose -f deploy/docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting app startup..."
            sleep 10

            echo "Health check..."
            if curl -f -s https://app.latermitiere.com > /dev/null; then
              echo "✅ Deploy OK"
            else
              echo "❌ Health check failed → rollback"

              if [ ! -z "$OLD_IMAGE" ]; then
                sed -i "s|termitiere-platform:$SHA_SHORT|$OLD_IMAGE|g" deploy/docker-compose.prod.yml
                docker compose -f deploy/docker-compose.prod.yml up -d
              fi

              exit 1
            fi
