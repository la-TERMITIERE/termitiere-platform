name: Build & Push to GHCR

on:
  push:
    branches:
      - vps-deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}

          IMAGE_LATEST="ghcr.io/${OWNER_LOWER}/termitiere-platform:latest"
          IMAGE_SHA="ghcr.io/${OWNER_LOWER}/termitiere-platform:${SHA}"

          echo "Building:"
          echo "$IMAGE_LATEST"
          echo "$IMAGE_SHA"

          docker build \
            -f deploy/Dockerfile \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            --build-arg VITE_USE_SUPABASE=true \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            .

      - name: Push images
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}

          docker push ghcr.io/${OWNER_LOWER}/termitiere-platform:latest
          docker push ghcr.io/${OWNER_LOWER}/termitiere-platform:${SHA}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e

            cd ~/termitiere-platform

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

            echo "======================================="
            echo "Deploy commit : $SHA_SHORT"
            echo "======================================="

            echo "Login GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

            echo "Saving current deployment..."

            OLD_TAG=$(grep '^IMAGE_TAG=' deploy/.env.deploy 2>/dev/null | tail -1 | cut -d'=' -f2- || true)

            echo "Current deployed tag : ${OLD_TAG:-none}"

            echo "Pull new image..."
            docker pull ghcr.io/$OWNER/termitiere-platform:$SHA_SHORT

            echo "Creating deploy env..."
            {
              echo "IMAGE_TAG=$SHA_SHORT"
              echo "DOMAIN_APP=app.latermitiere.com"
              echo "DOMAIN_API=api.latermitiere.com"
              echo "DOMAIN_SITE=latermitiere.com"
              echo "DOMAIN_CONTACT=contact.latermitiere.com"
              echo "DOMAIN_OAUTH=oauth.latermitiere.com"
              echo "DOMAIN_PUBLISH=publier.latermitiere.com"
            } > deploy/.env.deploy

            echo "Restart containers..."
            docker compose \
              --env-file deploy/.env.deploy \
              -f deploy/docker-compose.prod.yml \
              up -d --force-recreate

            echo "Waiting..."
            sleep 10

            echo "Health check..."
            
            if curl -f -sS --max-time 20 https://app.latermitiere.com > /dev/null; then
              echo "✅ Deploy OK"
              echo "Deployed image: ghcr.io/$OWNER/termitiere-platform:$SHA_SHORT"
            else
              echo "❌ Health check failed"
            
              echo "Container status:"
              docker ps -a --filter "name=termitiere-web"
            
              echo "Container logs:"
              docker logs --tail 100 termitiere-web || true
            
              if [ -n "$OLD_TAG" ]; then
                echo "Rollback to $OLD_TAG"
            
                {
                  echo "IMAGE_TAG=$OLD_TAG"
                  echo "DOMAIN_APP=app.latermitiere.com"
                  echo "DOMAIN_API=api.latermitiere.com"
                  echo "DOMAIN_SITE=latermitiere.com"
                  echo "DOMAIN_CONTACT=contact.latermitiere.com"
                  echo "DOMAIN_OAUTH=oauth.latermitiere.com"
                  echo "DOMAIN_PUBLISH=publier.latermitiere.com"
                } > deploy/.env.deploy
            
                docker compose \
                  --env-file deploy/.env.deploy \
                  -f deploy/docker-compose.prod.yml \
                  up -d --force-recreate
            
                echo "✅ Rollback completed"
              else
                echo "⚠️ No previous IMAGE_TAG found."
                echo "❌ Rollback impossible."
              fi
            
              exit 1
            fi
