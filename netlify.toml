[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN : autorise l'intégration en iframe de l'app MAXI-AGRO embarquée
    # (/apps/maxi-agro/) servie depuis la même origine que le portail.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Ajoutés après l'audit de sécurité du 2026-08-04.
    # HSTS : impose HTTPS pendant 1 an (empêche l'interception sur réseau public).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Coupe l'accès aux capteurs : l'application n'en utilise aucun.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # CSP en mode SIGNALEMENT SEUL dans un premier temps : elle n'empêche rien mais
    # rapporte les violations dans la console. Surveiller quelques jours d'usage réel
    # (export PDF, Excel, reCAPTCHA/App Check, polices Google), puis, si la console
    # reste propre, renommer cet en-tête en `Content-Security-Policy` pour l'activer.
    # Passer directement en mode bloquant casserait probablement les exports.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.google-analytics.com https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
